[workspace]
resolver = "3"
members = ["crates/*", "fuzz"]

[workspace.package]
authors = ["Fangdun Tsai <fundon@pindash.io>"]
description = "Zero-allocation, panic-free DEC VT500 terminal parser with UTF-8 decoding and no_std support."
keywords = ["terminal", "vt", "ansi", "parser", "escape"]
categories = ["parsing", "text-processing"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pindash-io/vtty"
version = "0.1.0"
rust-version = "1.89"

[workspace.dependencies]
vtty = { path = "crates/vtty", default-features = false }
vtty_core = { path = "crates/vtty_core", default-features = false }
vtty_status = { path = "crates/vtty_status" }
vtty_codec = { path = "crates/vtty_codec" }
vtty_emoji = { path = "crates/vtty_emoji" }

# Optional SIMD ground-state run classifier.
fearless_simd = { version = "1.1", default-features = false }
# Optional SIMD UTF-8 validation.
simdutf8 = "0.1"

base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
bitflags = "2"
const-hex = { version = "1.19.3", default-features = false }
smallvec = { version = "2.0.0-beta.3", default-features = false }
smol_str = { version = "0.3.7", default-features = false }
utf8_iter = "1"

icu_properties = { version = "=2.3.0", features = ["compiled_data", "alloc"] }
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
parley_emoji = "0.12.0"
packtab = "1.9.0"

## benchmark comparison crates
vte = "0.15.0"
vt100 = "0.16.2"
vtparse = "0.7.0"
rio-vt = { version = "0.5.28", default-features = false }

## dev
criterion = { version = "0.8", default-features = false, features = ["html_reports"] }

[workspace.lints]
rust.keyword_idents_2024 = "forbid"
rust.non_ascii_idents = "forbid"
rust.non_local_definitions = "forbid"
rust.unsafe_op_in_unsafe_fn = "forbid"

rust.elided_lifetimes_in_paths = "warn"
rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.trivial_numeric_casts = "warn"
rust.unnameable_types = "warn"
rust.unreachable_pub = "warn"
rust.unused_import_braces = "warn"
rust.unused_lifetimes = "warn"
rust.unused_macro_rules = "warn"
rust.unused_qualifications = "warn"

clippy.too_many_arguments = "allow"

clippy.allow_attributes_without_reason = "warn"
clippy.cast_possible_truncation = "warn"
clippy.cast_possible_wrap = "warn"
clippy.collection_is_never_read = "warn"
clippy.default_trait_access = "warn"
clippy.dbg_macro = "warn"
clippy.debug_assert_with_mut_call = "warn"
clippy.doc_markdown = "warn"
clippy.fn_to_numeric_cast_any = "warn"
clippy.infinite_loop = "warn"
clippy.large_stack_arrays = "warn"
clippy.mismatching_type_param_order = "warn"
clippy.missing_assert_message = "warn"
clippy.missing_fields_in_debug = "warn"
clippy.same_functions_in_if_condition = "warn"
clippy.semicolon_if_nothing_returned = "warn"
clippy.should_panic_without_expect = "warn"
clippy.todo = "warn"
clippy.unseparated_literal_suffix = "warn"
clippy.use_self = "warn"

clippy.cargo_common_metadata = "warn"
clippy.negative_feature_names = "warn"
clippy.redundant_feature_names = "warn"
clippy.wildcard_dependencies = "warn"

rustdoc.broken_intra_doc_links = "deny"

[profile.release]
opt-level = 3

# LTO + single codegen unit only for the benchmark profile: `cargo bench`
# benefits from cross-crate inlining, but `lto = "fat"` breaks the fuzz
# sanitizer-coverage (sancov) linking on the `release` profile.
[profile.bench]
lto = "fat"
codegen-units = 1

[profile.instrument]
inherits = "release"
debug = true
strip = "none"
