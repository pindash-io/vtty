# Standalone crate: opts out of the parent workspace so the repo's strict
# lints don't apply to the demo.
[workspace]

[package]
name = "vtty-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Minimal browser demo: feed bytes to vtty and read the parsed text."
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The parser (re-exports vtty_core's Perform / State / model types).
vtty = { path = "../../crates/vtty", default-features = false, features = ["simd"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true

# The wasm-bindgen output uses `table.fill`, which the globally-installed
# binaryen 116 wasm-opt chokes on. opt-level=s + LTO already shrink the wasm,
# so skip the redundant wasm-opt pass.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
