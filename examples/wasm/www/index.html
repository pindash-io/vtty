<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vtty — wasm demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div id="out" class="out"></div>
      <section id="examples" class="examples"></section>
      <footer>
        <select id="theme" title="highlight theme"></select>
        <select id="lang" title="language"></select>
        <button id="scheme" type="button" title="toggle light/dark">☀️</button>
        <input
          id="input"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="Type text (\\x1b and \\n are interpreted)…"
        />
        <button id="feed">Feed</button>
        <button id="demo">Demo</button>
        <button id="clear">Clear</button>
      </footer>
      <p class="hint">
        ANSI is parsed by
        <a href="https://crates.io/crates/vtty">vtty</a> → WebAssembly:
        terminal examples render as a styled
        <a href="https://crates.io/crates/vtty">vtty_screen</a> grid, code
        examples are syntax-highlighted by @pierre/highlights.
      </p>
    </main>
    <script type="importmap">
      {
        "imports": {
          "@pierre/highlights": "https://esm.sh/@pierre/highlights",
          "@pierre/highlights/themes": "https://esm.sh/@pierre/highlights/themes"
        }
      }
    </script>
    <script type="module" src="main.js"></script>
  </body>
</html>
