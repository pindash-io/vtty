<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vtty — wasm demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <pre id="out" class="out"></pre>
      <section id="examples" class="examples"></section>
      <footer>
        <input
          id="input"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="Type text (\\x1b and \\n are interpreted)…"
        />
        <button id="feed">Feed</button>
        <button id="demo">Demo</button>
        <button id="clear">Clear</button>
      </footer>
      <p class="hint">
        Escape sequences are parsed; SGR colors/styles are rendered, everything
        else is consumed. Built with
        <a href="https://crates.io/crates/vtty">vtty</a> → WebAssembly.
      </p>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
