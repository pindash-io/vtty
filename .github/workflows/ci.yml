name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    # Platform-independent checks; run once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: typos,taplo,cargo-rdme,cargo-hack

      - name: Spell-check
        run: typos

      - name: TOML format check
        run: taplo fmt --check

      - name: Install cargo-rdme intralink toolchain
        # cargo-rdme resolves intra-doc links with a pinned nightly rustdoc;
        # install exactly the toolchain the installed cargo-rdme expects.
        run: cargo rdme install-rust-toolchain-for-intralinks

      - name: README sync check
        run: |
          cargo rdme -w vtty --check
          cargo rdme -w vtty_core --check
          cargo rdme -w vtty_codec --check
          cargo rdme -w vtty_width --check
          cargo rdme -w vtty_ffi --check
          cargo rdme -w vtty_grapheme --check
          cargo rdme -w vtty_status --check
          cargo rdme -w vtty_screen --check

      - name: Rust format check
        run: cargo fmt --check --all

      - name: Feature-powerset check
        # Every feature combination compiles (catches e.g. simd × no_std
        # interactions that --all-features/--no-default-features miss).
        run: cargo hack check --workspace --feature-powerset --skip default

  test:
    # Compile + test natively on x86_64 Linux, ARM64 Linux, ARM64 macOS, and
    # x86_64 Windows, so the x86 SSE/AVX and ARM NEON SIMD backends are both
    # exercised. Native runners avoid cross-compiling the rio-vt/simdutf C++
    # build script (which needs a matching cross toolchain).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Tests (all features)
        run: cargo test --workspace --all-features

      - name: Tests (no default features)
        run: cargo test --workspace --no-default-features

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  no-std:
    # True no_std check against a bare-metal target (no allocator, no std).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: no_std check (bare-metal target)
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo check -p vtty --no-default-features --target thumbv7em-none-eabihf

  fuzz-smoke:
    # Native runners only: libFuzzer needs rustc's `-Z sanitizer=fuzzer`,
    # which is unsupported on Windows MSVC, and the rio-vt/simdutf C++ build
    # script wants the host toolchain. The ARM NEON and x86 SSE/AVX SIMD
    # backends are each exercised on their native Linux/macOS runners.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-linux
          - os: macos-latest
            target: aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - name: Resolve target triple
        run: |
          case "${{ matrix.target }}" in
            x86_64-linux) echo "TRIPLE=x86_64-unknown-linux-gnu" >> "$GITHUB_ENV" ;;
            aarch64-linux) echo "TRIPLE=aarch64-unknown-linux-gnu" >> "$GITHUB_ENV" ;;
            aarch64-macos) echo "TRIPLE=aarch64-apple-darwin" >> "$GITHUB_ENV" ;;
          esac

      - name: Install target
        run: rustup target add "$TRIPLE"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Seed corpus
        run: |
          mkdir -p fuzz/corpus/differential fuzz/corpus/differential-simd fuzz/corpus/differential-rio fuzz/corpus/codec
          cp fuzz/seeds/* fuzz/corpus/differential/
          cp fuzz/seeds/* fuzz/corpus/differential-simd/
          cp fuzz/seeds/* fuzz/corpus/differential-rio/
          cp fuzz/seeds/* fuzz/corpus/codec/

      - name: Fuzz smoke — vtty vs vte
        run: cargo fuzz run differential --target "$TRIPLE" -- -max_total_time=30

      - name: Fuzz smoke — vtty-simd vs vte
        run: cargo fuzz run differential-simd --target "$TRIPLE" -- -max_total_time=30

      - name: Fuzz smoke — vtty vs rio-vt
        run: cargo fuzz run differential-rio --target "$TRIPLE" -- -max_total_time=30

      - name: Fuzz smoke — structured random
        run: cargo fuzz run random --target "$TRIPLE" -- -max_total_time=30

      - name: Fuzz smoke — no-panic
        run: cargo fuzz run robustness --target "$TRIPLE" -- -max_total_time=30

      - name: Fuzz smoke — codec round-trip
        run: cargo fuzz run codec --target "$TRIPLE" -- -max_total_time=30

  cross:
    # Cross-check the library crates for Linux targets the native matrix
    # doesn't cover. The library is pure Rust — rio-vt's simdutf C++ build
    # script only lives in vtty's dev-deps and is built natively by the test
    # job — so this needs no cross C/C++ toolchain. (cross-rs's aarch64 g++
    # is too old for simdutf's `vld1q_u32_x2` NEON intrinsic anyway.)
    env:
      # Pinned so a future cross release can't silently break CI.
      CROSS_VERSION: v0.2.5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux
          - i686-linux
          - x86_64-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: |
          dir="$RUNNER_TEMP/cross-download"
          mkdir "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          cd "$dir"
          curl -LO "https://github.com/cross-rs/cross/releases/download/$CROSS_VERSION/cross-x86_64-unknown-linux-musl.tar.gz"
          tar xf cross-x86_64-unknown-linux-musl.tar.gz

      - name: Check library crates (cross)
        run: |
          case "${{ matrix.target }}" in
            aarch64-linux) triple=aarch64-unknown-linux-gnu ;;
            i686-linux) triple=i686-unknown-linux-gnu ;;
            x86_64-musl) triple=x86_64-unknown-linux-musl ;;
          esac
          cross check -p vtty -p vtty_core -p vtty_codec -p vtty_width -p vtty_grapheme -p vtty_status -p vtty_screen --target "$triple" --all-features

  bsd:
    # Compile-check the library crates for the BSDs the native matrix can't
    # reach. FreeBSD and NetBSD use cross-rs images; OpenBSD has no cross-rs
    # image and no rustup std (tier 3), so it is checked from source with
    # nightly build-std. All three are compile checks, not VM test runs.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [freebsd, netbsd, openbsd]
    env:
      # Pinned so a future cross release can't silently break CI.
      CROSS_VERSION: v0.2.5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.os != 'openbsd'

      - uses: dtolnay/rust-toolchain@nightly
        if: matrix.os == 'openbsd'
        with:
          components: rust-src

      - name: Install cross
        if: matrix.os != 'openbsd'
        run: |
          dir="$RUNNER_TEMP/cross-download"
          mkdir "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          cd "$dir"
          curl -LO "https://github.com/cross-rs/cross/releases/download/$CROSS_VERSION/cross-x86_64-unknown-linux-musl.tar.gz"
          tar xf cross-x86_64-unknown-linux-musl.tar.gz

      - name: Check library crates (cross)
        if: matrix.os != 'openbsd'
        run: cross check -p vtty -p vtty_core -p vtty_codec -p vtty_width -p vtty_grapheme -p vtty_status -p vtty_screen --target x86_64-unknown-${{ matrix.os }} --all-features

      - name: Check library crates (build-std)
        if: matrix.os == 'openbsd'
        run: cargo check -Z build-std -p vtty -p vtty_core -p vtty_codec -p vtty_width -p vtty_grapheme -p vtty_status -p vtty_screen --target x86_64-unknown-openbsd --all-features

  bsd-aarch64:
    # aarch64 BSD targets are all tier 3 with no cross-rs image and no rustup
    # std, so they are checked from source with nightly build-std. Same
    # compile-only scope as the `bsd` job.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [freebsd, netbsd, openbsd]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Check library crates (build-std)
        run: cargo check -Z build-std -p vtty -p vtty_core -p vtty_codec -p vtty_width -p vtty_grapheme -p vtty_status -p vtty_screen --target aarch64-unknown-${{ matrix.os }} --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89

      - name: Check (MSRV)
        run: cargo check --workspace --all-features

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Audit RustSec advisories
        run: cargo audit

      - name: Deny vulnerable dependencies
        run: cargo deny check advisories

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Compile benchmarks
        run: cargo bench -p vtty_bench --no-run
