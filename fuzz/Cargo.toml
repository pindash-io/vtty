[package]
name = "vtty-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
smallvec.workspace = true
vt100.workspace = true
vte.workspace = true
vtparse.workspace = true
rio-vt.workspace = true
vtty = { workspace = true, features = ["simd"] }
vtty_codec.workspace = true

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential-rio"
path = "fuzz_targets/differential-rio.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential-simd"
path = "fuzz_targets/differential-simd.rs"
test = false
doc = false
bench = false

[[bin]]
name = "robustness"
path = "fuzz_targets/robustness.rs"
test = false
doc = false
bench = false

[[bin]]
name = "random"
path = "fuzz_targets/random.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec"
path = "fuzz_targets/codec.rs"
test = false
doc = false
bench = false

[lints]
workspace = true
