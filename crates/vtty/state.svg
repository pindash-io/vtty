"var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="104.25" y="352.9">CAN or SUB cancels it or the</tspan><tspan x="104.25" y="370.9">final byte dispatches it</tspan></text></g><g class="pele-edge-label" data-id="edge8"><rect x="31.33" y="637" width="169.84" height="21" rx="3" fill="var(--_bg)"/><text x="116.25" y="652.4" text-anchor="middle">a bad intermediate arrives</text></g><g class="pele-edge-label" data-id="edge9"><rect x="757.68" y="516.5" width="186.93" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="851.15" y="530.4">CAN or SUB cancels it or ST</tspan><tspan x="851.15" y="548.4">ends it and unhooks</tspan></text></g><g class="pele-edge-label" data-id="edge10"><rect x="359.97" y="690" width="169.84" height="21" rx="3" fill="var(--_bg)"/><text x="444.89" y="705.4" text-anchor="middle">a bad intermediate arrives</text></g><g class="pele-edge-label" data-id="edge11"><rect x="438.71" y="339" width="195.5" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="536.46" y="352.9">CAN or SUB cancels it or BEL</tspan><tspan x="536.46" y="370.9">or ST ends it</tspan></text></g><g class="pele-edge-label" data-id="edge12"><rect x="654.21" y="339" width="186.93" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="747.68" y="352.9">CAN or SUB cancels it or ST</tspan><tspan x="747.68" y="370.9">ends it with nothing to report</tspan></text></g><g class="pele-edge-label" data-id="edge13"><rect x="409.69" y="577" width="186.21" height="21" rx="3" fill="var(--_bg)"/><text x="502.8" y="592.4" text-anchor="middle">the first content byte hooks it</text></g><g class="pele-edge-label" data-id="edge14"><rect x="964.61" y="516.5" width="188.5" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="1058.86" y="530.4">CAN or SUB cancels it or the</tspan><tspan x="1058.86" y="548.4">final byte e