294.25C708.37,257.63 729.18,257.63 729.18,221L729.18,215"/><path class="pele-marker" d="M729.18,208L732.54,216L725.82,216Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge13"><path d="M1238.39,512.5L1238.39,294.25C1238.39,258.14 1148.3,236 1001.32,236C854.33,236 764.24,230.02 764.24,220.25L764.24,215"/><path class="pele-marker" d="M764.24,208L767.6,216L760.88,216Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge14"><path d="M1225.79,556.5L1225.79,600C1225.79,606.94 1153.5,606.94 1153.5,613.88L1153.5,618.5"/><path class="pele-marker" d="M1153.5,625.5L1150.14,617.5L1156.86,617.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge15"><path d="M328.76,625.5L328.76,612.5C328.76,606.24 104.25,600.01 104.25,593.75L104.25,335C104.25,278 702.88,278 702.88,221L702.88,215"/><path class="pele-marker" d="M702.88,208L706.24,216L699.52,216Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge16"><path d="M1091.22,625.5L1091.22,612.5C1091.22,607.81 550.6,598.44 550.6,593.75L550.6,335C550.6,278 720.41,278 720.41,221L720.41,215"/><path class="pele-marker" d="M720.41,208L723.77,216L717.05,216Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="edge1"><rect x="909.18" y="290" width="101.37" height="21" rx="3" fill="var(--_bg)"/><text x="959.87" y="305.4" text-anchor="middle">you press ESC</text></g><g class="pele-edge-label" data-id="edge2"><rect x="740.37" y="290" width="148.81" height="21" rx="3" fill="var(--_bg)"/><text x="814.78" y="305.4" text-anchor="middle">CAN or SUB cancels it</text></g><g class="pele-edge-label" data-id="edge3"><rect x="259.84" y="456.5" width="44.57" height="21" rx="3" fill="var(--_bg)"/><text x="282.12" y="471.9" text-anchor="middle">ESC [</text></g><g class="pele-edge-label" data-id="edge4"><rect x="878.84" y="456.5" width="50.01" height="21" rx="3" fill="var(--_bg)"/><text x="903.84" y="471.9" text-anchor="middle">ESC P</text></g><g class="pele-edge-label" data-id="edge5"><rect x="718.37" y="456.5" width="44.57" height="21" rx="3" fill="var(--_bg)"/><text x="740.65" y="471.9" text-anchor="middle">ESC ]</text></g><g class="pele-edge-label" data-id="edge6"><rect x="1086.98" y="449" width="141.41" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="1157.69" y="462.9">you type ESC X, ^, or</tspan><tspan x="1157.69" y="480.9">underscore</tspan></text></g><g class="pele-edge-label" data-id="edge7"><rect x="155.59" y="339" width="188.5" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="249.84" y="352.9">CAN or SUB cancels it or the</tspan><tspan x="249.84" y="370.9">final byte dispatches it</tspan></text></g><g class="pele-edge-label" data-id="edge8"><rect x="176.92" y="577" width="169.84" height="21" rx="3" fill="var(--_bg)"/><text x="261.84" y="592.4" text-anchor="middle">a bad intermediate arrives</text></g><g class="pele-edge-label" data-id="edge9"><rect x="968.52" y="346.5" width="148.81" height="21" rx="3" fill="var(--_bg)"/><text x="1042.93" y="361.9" text-anchor="middle">CAN or SUB cancels it</text></g><g class="pele-edge-label" data-id="edge10"><rect x="370.76" y="577" width="169.84" height="21" rx="3" fill="var(--_bg)"/><text x="455.68" y="592.4" text-anchor="middle">a bad intermediate arrives</text></g><g class="pele-edge-label" data-id="edge11"><rect x="973.17" y="577" width="139.52" height="21" rx="3" fill="var(--_bg)"/><text x="1042.93" y="592.4" text-anchor="middle">the final byte hooks it</text></g><g class="pele-edge-label" data-id="edge12"><rect x="610.62" y="339" width="195.5" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="708.37" y="352.9">CAN or SUB cancels it or BEL</tspan><tspan x="708.37" y="370.9">or ST ends it</tspan></text></g><g class="pele-edge-label" data-id="edge13"><rect x="1144.92" y="339" width="186.93" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="1238.39" y="352.9">CAN or SUB cancels it or ST</tspan><tspan x="1238.39" y="370.9">ends it with nothing to report</tspan></text></g><g class="pele-edge-label" data-id="edge14"><rect x="1132.69" y="577" width="186.21" height="21" rx="3" fill="var(--_bg)"/><text x="1225.79" y="592.4" text-anchor="middle">the first content byte hooks it</text></g><g class="pele-edge-label" data-id="edge15"><rect x="10" y="516.5" width="188.5" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="104.25" y="530.4">CAN or SUB cancels it or the</tspan><tspan x="104.25" y="548.4">final byte ends the discard</tspan></text></g><g class="pele-edge-label" data-id="edge16"><rect x="448.16" y="516.5" width="204.87" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="550.6" y="530.4">ST ends it and unhooks or CAN</tspan><tspan x="550.6" y="548.4">or SUB ends it and unhooks</tspan></text></g></g><g class="pele-nodes"><g class="pele-node pele-state blue" data-id="s0" transform="translate(733.56,186)"><rect x="-42.68" y="-22" width="85.36" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Ground</text></g><g class="pele-node pele-state teal" data-id="s1" transform="translate(893.84,357)"><rect x="-42.68" y="-22" width="85.36" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Escape</text></g><g class="pele-node pele-state teal" data-id="s2" transform="translate(261.84,534.5)"><rect x="-29.34" y="-22" width="58.67" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">CSI</text></g><g class="pele-node pele-state teal" data-id="s3" transform="translate(1030.93,534.5)"><rect x="-32.89" y="-22" width="65.78" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">DCS</text></g><g class="pele-node pele-state teal" data-id="s4" transform="translate(720.37,534.5)"><rect x="-33.34" y="-22" width="66.67" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">OSC</text></g><g class="pele-node pele-state teal" data-id="s5" transform="translate(1225.79,534.5)"><rect x="-65.79" y="-22" width="131.58" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">SOS/PM/APC</text></g><g class="pele-node pele-state orange" data-id="s6" transform="translate(344.76,647.5)"><rect x="-38.68" y="-22" width="77.36" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Ignore</text></g><g class="pele-node pele-state teal" data-id="s7" transform="translate(1126.36,647.5)"><rect x="-79.14" y="-22" width="158.27" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">DCS passthrough</text></g><g class="pele-node pele-state-start" data-id="root_start" transform="translate(733.56,113)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state blue" data-id="lg0" transform="translate(321.59,82)"><rect x="-28.9" y="-22" width="57.79" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Idle</text></g><g class="pele-node pele-state teal" data-id="lg1" transform="translate(456.74,82)"><rect x="-66.26" y="-22" width="132.51" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">In a sequence</text></g><g class="pele-node pele-state orange" data-id="lg2" transform="translate(616.78,82)"><rect x="-53.78" y="-22" width="107.57"