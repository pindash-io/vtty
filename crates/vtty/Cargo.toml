[package]
name = "vtty"
version.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["reply", "termcap", "status"]
# DECRQSS/DECRQM/XTGETTCAP answer formatting (`Reply`).
reply = ["vtty_core/reply"]
# XTGETTCAP terminfo capability table (`Cap`/`CapValue`); implies `reply`.
termcap = ["vtty_core/termcap"]
# OSC 7501 Program Status Protocol (`ProgramStatus`).
status = ["dep:vtty_status"]
# SIMD-accelerated printable-run scanning + UTF-8 validation.
simd = ["dep:fearless_simd", "fearless_simd/std", "dep:simdutf8"]
# SIMD UTF-8→UTF-32 transcode (compile-time lookup tables). Implies `simd`.
simd-transcode = ["simd"]

[dependencies]
vtty_core = { path = "../vtty_core", default-features = false }
vtty_status = { workspace = true, optional = true }

bitflags.workspace = true
fearless_simd = { workspace = true, optional = true }
simdutf8 = { workspace = true, optional = true }
smallvec.workspace = true
utf8_iter.workspace = true

[dev-dependencies]
vtty_codec = { path = "../vtty_codec" }
smallvec.workspace = true
vte.workspace = true
rio-vt.workspace = true

[lints]
workspace = true
