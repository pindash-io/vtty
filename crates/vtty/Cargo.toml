[package]
name = "vtty"
version.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = []
# SIMD-accelerated printable-run scanning + UTF-8 validation.
simd = ["vtty_core/simd"]
# SIMD UTF-8→UTF-32 transcode (compile-time lookup tables). Implies `simd`.
simd-transcode = ["vtty_core/simd-transcode", "simd"]

[dependencies]
vtty_core = { path = "../vtty_core", default-features = false }

[dev-dependencies]
vtty_codec = { path = "../vtty_codec" }

[lints]
workspace = true
