[package]
name = "vtty_bench"
version.workspace = true
edition.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
# The benchmark crate is dev-only tooling; fux-vt pins its real MSRV above
# the library's 1.89, so it does not inherit the workspace rust-version.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[dependencies]
# vtty is compiled with the `simd-transcode` feature so both the scalar
# (`Parser::new`) and full SIMD (`Parser::with_simd`) paths are available.
vtty = { workspace = true, features = ["simd-transcode"] }

[dev-dependencies]
# The comparison parsers are only exercised by the `[[bench]]` target, so they
# are dev-dependencies (not `dependencies`) — `cargo::unused_dependencies`.
vtty_screen = { workspace = true }

criterion.workspace = true
fux-vt = "0.15.0"
rio-vt.workspace = true
vt100.workspace = true
vte.workspace = true
vtparse.workspace = true

[[bench]]
name = "vt_input"
harness = false

[lints]
workspace = true
