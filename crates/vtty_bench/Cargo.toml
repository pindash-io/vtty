[package]
name = "vtty_bench"
version.workspace = true
edition.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[dependencies]
# vtty is compiled with the `simd-transcode` feature so both the scalar
# (`Parser::new`) and full SIMD (`Parser::with_simd`) paths are available.
vtty = { workspace = true, features = ["simd-transcode"] }

rio-vt.workspace = true
vt100.workspace = true
vte.workspace = true
vtparse.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "vt_input"
harness = false

[lints]
workspace = true
