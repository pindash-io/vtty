[package]
name = "vtty_width"
version.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
build = "build.rs"

[features]
default = ["simd", "baked"]
# Vectorized scan for the first non-ASCII byte in the cell-width fast paths.
simd = ["dep:fearless_simd", "fearless_simd/std"]
# Baked emoji+width table (generated by build.rs into OUT_DIR).
baked = []
# Runtime ICU4X property lookups (alternative to `baked`; also used by the
# differential test).
icu = ["dep:icu_properties"]

[dependencies]
fearless_simd = { workspace = true, optional = true }
icu_normalizer.workspace = true
icu_properties = { workspace = true, optional = true }
parley_emoji.workspace = true

[build-dependencies]
icu_properties.workspace = true
packtab.workspace = true

[dev-dependencies]
# Differential oracle for the `icu`-feature width-derivation test.
unicode-width = "0.2"

[lints]
workspace = true
