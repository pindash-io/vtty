[package]
name = "vtty_core"
version.workspace = true
description = "The irreducible core of vtty: the Perform contract, model types, and the State sink."
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# DECRQSS/DECRQM/XTGETTCAP answer formatting (`Reply`).
reply = []
# XTGETTCAP terminfo capability table (`Cap`/`CapValue`); implies `reply`.
termcap = ["reply"]
[dependencies]
bitflags.workspace = true
compact_str.workspace = true
const-hex = { workspace = true, features = ["alloc"] }
smallvec.workspace = true

[lints]
workspace = true
