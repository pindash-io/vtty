[package]
name = "vtty_width"
version.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
build = "build.rs"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["simd", "baked", "perf-inline"]
# Vectorized scan for the first non-ASCII byte in the cell-width fast paths.
simd = ["dep:fearless_simd", "fearless_simd/std"]
# Baked emoji+width table (generated by build.rs into OUT_DIR).
baked = []
# Runtime ICU4X property lookups (alternative to `baked`; also used by the
# differential test).
icu = ["dep:icu_properties"]
# More aggressive inline annotations on the width hot paths. Default-on; opt
# out for smaller code at some throughput cost.
perf-inline = []
# Experimental CodePointTrie-style two-level lookup (built alongside the
# packtab tables). The lookup micro-bench is ~2.4x faster, but the table
# lookup is not the end-to-end bottleneck and the larger footprint regresses
# the `combining` case, so the packtab path stays the default.
trie = []

[dependencies]
icu_normalizer.workspace = true
parley_emoji.workspace = true

fearless_simd = { workspace = true, optional = true }
icu_properties = { workspace = true, optional = true }

[build-dependencies]
icu_properties.workspace = true
packtab.workspace = true

[dev-dependencies]
# Differential oracle for the `icu`-feature width-derivation test.
unicode-width = "=0.2.3"

[lints]
workspace = true
